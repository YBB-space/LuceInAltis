<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALTIS STRUCTURE - Coming Soon</title>
  <link rel="icon" href="../img/altis_logo.png" type="image/png" />
  <style>
    :root {
      --text: #f3f6fb;
      --muted: rgba(243, 246, 251, 0.74);
      --line: rgba(255, 255, 255, 0.2);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", "Pretendard", "SUIT", sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
      background: #040507;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    .bg-video video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: max(100vw, 177.78vh);
      height: max(56.25vw, 100vh);
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%) scale(1.08);
      object-fit: cover;
      filter: blur(6px) brightness(0.5) contrast(1.05);
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.58) 100%);
    }

    .card {
      width: min(92vw, 640px);
      text-align: center;
      padding: 0;
      border: 0;
      background: transparent;
      border-radius: 0;
    }

    .logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      margin-bottom: 14px;
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: clamp(14px, 2.8vw, 16px);
    }

    .home {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
  </style>
</head>
<body>
  <div class="bg-video" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="../vid/sponsors_land_vid.mp4" type="video/mp4" />
    </video>
  </div>

  <main class="card" aria-live="polite">
    <img class="logo" src="../img/altis_logo.png" alt="ALTIS logo" />
    <h1>Coming Soon</h1>
    <p>STRUCTURE 페이지를 준비 중입니다.<br />곧 업데이트됩니다.</p>
    <a class="home" href="../index.html">Back to Home</a>
  </main>
</body>
</html>
